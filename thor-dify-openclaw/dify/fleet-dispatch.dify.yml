version: "0.6.0"
kind: app
app:
  name: Thor Fetch Planner
  mode: advanced-chat
  description: 一小段 Chatflow。只抽出 item/dest/recipient，夾送交給 Thor 機器狗。
  icon: "🐕"
  icon_type: emoji
  icon_background: "#FFEAD5"
  use_icon_as_answer_icon: false
workflow:
  graph:
    nodes:
      - id: "start"
        type: custom
        position: { x: 80, y: 280 }
        positionAbsolute: { x: 80, y: 280 }
        width: 244
        height: 90
        data:
          type: start
          title: Start
          desc: ""
          variables: []
      - id: "llm"
        type: custom
        position: { x: 380, y: 280 }
        positionAbsolute: { x: 380, y: 280 }
        width: 244
        height: 198
        data:
          type: llm
          title: 取物規劃
          desc: 只輸出 JSON
          model:
            provider: ""
            name: ""
            mode: chat
            completion_params:
              temperature: 0.1
          prompt_template:
            - role: system
              text: |
                你是 Thor 的取物規劃器。只輸出一個 JSON 物件，不要 markdown、不要解說。
                fetch：{"intent":"fetch","item":"物品","dest":"位置","recipient":"交給誰","scout":"crazyflie","confirm":true,"say":"一句繁中"}
                Crazyflie 只當空中眼，不能夾不能送。室內不飛或不要飛 → scout=none。
                「用飛機送東西」仍走 fetch + scout=crazyflie，say 寫明飛機只看、狗負責夾。
                缺 item/dest/recipient → {"intent":"display","target":"k10","say":"請再說一次要拿什麼、送到哪、給誰"}
                取消 → {"intent":"abort","target":"dogzilla","confirm":false,"say":"停飛並停下機器狗"}
                只回話 → {"intent":"say","target":"reachy","say":"..."}（來源助理是 k10 時 target 用 k10）
                [助理=reachy|k10] 只代表誰聽到語音。夾送是機器狗，眼睛是 Crazyflie。
            - role: user
              text: "{{#sys.query#}}"
          variables: []
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          memory:
            query_prompt_template: "{{#sys.query#}}"
            window:
              enabled: false
              size: 4
      - id: "answer"
        type: custom
        position: { x: 700, y: 280 }
        positionAbsolute: { x: 700, y: 280 }
        width: 244
        height: 90
        data:
          type: answer
          title: Answer
          desc: ""
          answer: "{{#llm.text#}}"
          variables: []
    edges:
      - id: start-llm
        source: "start"
        sourceHandle: source
        target: "llm"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: start
          targetType: llm
      - id: llm-answer
        source: "llm"
        sourceHandle: source
        target: "answer"
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: llm
          targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  features:
    file_upload:
      enabled: false
    opening_statement: "跟現地 Reachy 或隨身 K10 說：拿什麼、送到哪、給誰。我只回 JSON。"
    suggested_questions:
      - "把桌上的紅色馬克杯拿到客廳茶几給 Hank"
      - "機器狗停下來"
      - "把遙控器送到沙發給媽媽"
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  environment_variables: []
  conversation_variables: []
  rag_pipeline_variables: []
dependencies: []
